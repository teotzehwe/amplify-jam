<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#fff8ef">
  <title>Amplify — Host console</title>
  <link rel="stylesheet" href="/app.css">
  <link rel="stylesheet" href="/board.css">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' fill='%23465016'/><path d='M8 20v-4m4 8v-12m4 16V6m4 14v-8m4 6v-2' stroke='%23f7f2e8' stroke-width='2.5' stroke-linecap='round' fill='none'/></svg>">
  <style>
    .tabs {
      display: flex;
      gap: 8px;
      padding: 4px 0 10px;
      background: transparent;
      border-bottom: 0;
      border-radius: 0;
      overflow-x: auto;
    }
    .tabs button {
      padding: 10px 14px;
      border: 2px solid var(--press-color);
      border-radius: 14px;
      background: var(--surface);
      color: var(--muted);
      font-weight: 700;
      font-size: var(--text-sm);
      letter-spacing: -0.01em;
      cursor: pointer;
      white-space: nowrap;
      margin-bottom: 3px;
      box-shadow: 0 3px 0 0 var(--press-color);
      transition:
        transform var(--press-ms) var(--ease-press),
        box-shadow var(--press-ms) var(--ease-press),
        background var(--press-ms) ease,
        color var(--press-ms) ease;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }
    .tabs button:hover {
      color: var(--ink);
      background: var(--surface-2);
      transform: translateY(-3px);
      box-shadow: 0 6px 0 0 var(--press-color);
    }
    .tabs button:active {
      transform: translateY(3px);
      box-shadow: 0 1px 0 0 var(--press-color);
      transition-duration: 0.05s;
    }
    .tabs button[aria-selected="true"] {
      background: var(--amber);
      color: var(--cream);
      border-color: var(--press-color);
      box-shadow: 0 3px 0 0 var(--press-color);
    }
    .tabs button[aria-selected="true"]:hover {
      background: #345c1a;
      color: var(--cream);
    }
    /* Primary navigation, and 40px by default — under the thumb floor. */
    @media (pointer: coarse) { .tabs button { min-height: 44px; } }
    /* Four tabs plus their counts need ~355px of the 339px a 375px phone
       offers, so Settings was clipped behind a scrollbar. Tightening the
       horizontal padding on narrow screens fits all four without scrolling —
       primary navigation should not need to be discovered by dragging. */
    @media (max-width: 400px) {
      .tabs { padding: 2px 0 8px; gap: 6px; }
      .tabs button { padding-left: 11px; padding-right: 11px; }
      .tabs .count { margin-left: 4px; }
    }
    /* --muted, not --faint: the tab strip sits on --surface-3, the darkest of
       the paper tones, where --faint measures 4.35:1. It stays quieter than the
       tab label, which is full-strength ink. */
    .tabs .count { color: inherit; opacity: 0.75; font-weight: 600; margin-left: 6px; }
    .tabs button[aria-selected="true"] .count { opacity: 0.9; }
    /* Alert counts stay punchy even on inactive tabs. */
    .tabs .count--alert {
      color: var(--ink-amber);
      opacity: 1;
      font-weight: 800;
      font-size: var(--text-xs);
    }
    .tabs button[aria-selected="true"] .count--alert {
      color: color-mix(in srgb, var(--cream) 85%, #ffe08a);
    }

    .roster { display: grid; gap: 0; }
    @media (min-width: 780px) { .roster { grid-template-columns: 1fr 1fr; column-gap: 32px; } }
    .person {
      display: grid;
      gap: 8px;
      padding: 16px;
      border-radius: 18px;
      background: var(--surface);
      border: 2px solid var(--line-strong);
      box-shadow: 0 4px 0 0 color-mix(in srgb, var(--press-color) 28%, transparent);
      transition:
        transform var(--press-ms) var(--ease-press),
        box-shadow var(--press-ms) var(--ease-press);
    }
    .person:hover {
      transform: translateY(-3px);
      box-shadow: 0 7px 0 0 color-mix(in srgb, var(--press-color) 35%, transparent);
    }
    .person--away { opacity: 0.5; }
    .person__top { display: flex; align-items: center; gap: 10px; }
    .person__name {
      font-family: var(--font-display);
      font-size: var(--text-md);
      font-weight: 500;
      font-style: italic;
      letter-spacing: -0.01em;
    }

    .stat-strip { display: flex; gap: 28px; flex-wrap: wrap; padding: 4px 0 8px; }
    .stat b {
      display: block;
      font-size: var(--text-xl);
      font-weight: 500;
      letter-spacing: -0.02em;
      color: var(--ink-amber);
    }
    .stat span { color: var(--muted); font-size: var(--text-sm); font-style: italic; }
    .slot {
      display: grid;
      grid-template-columns: 1fr auto;
      grid-template-areas:
        "inst   inst"
        "who    action";
      align-items: center;
      gap: 2px 12px;
      padding: 14px 16px;
      border-radius: 18px;
      background: var(--surface);
      border: 2px solid var(--line-strong);
      box-shadow: 0 4px 0 0 color-mix(in srgb, var(--press-color) 28%, transparent);
      transition:
        transform var(--press-ms) var(--ease-press),
        box-shadow var(--press-ms) var(--ease-press);
    }
    .slot:hover {
      transform: translateY(-3px);
      box-shadow: 0 7px 0 0 color-mix(in srgb, var(--press-color) 35%, transparent);
    }
    .slot__inst { grid-area: inst; }
    .slot__who { grid-area: who; min-width: 0; }
    .slot .btn { grid-area: action; }
    .slot--resting { border-color: rgba(196, 92, 38, 0.35); background: rgba(196, 92, 38, 0.08); border-radius: var(--radius); padding-left: 12px; padding-right: 12px; }
    @media (min-width: 720px) {
      .slot {
        grid-template-columns: 130px 1fr auto;
        grid-template-areas: "inst who action";
        gap: 10px;
        padding: 16px;
      }
    }
    .slot__inst {
      font-size: var(--text-xs);
      letter-spacing: 0.06em;
      text-transform: uppercase;
      font-weight: 600;
      color: var(--ink-amber);
    }
    .slot__name { font-family: var(--font-display); font-size: var(--text-lg); font-weight: 500; letter-spacing: -0.015em; }
    .slot__why { color: var(--muted); font-size: var(--text-sm); margin-top: 2px; }
    .slot select { padding: 9px 11px; font-size: var(--text-sm); }
    .slot .btn { justify-self: start; }

    .sub-head {
      font-size: var(--text-sm);
      font-weight: 500;
      color: var(--muted);
    }

    /* --- the sign-up bench ------------------------------------------ */
    /* One tap seats somebody. Everything on the row exists to make that tap
       a fair one: how many turns they have had, when they last played, and
       any cap they set for themselves. */
    .pick-row {
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 8px 12px;
      align-items: center;
      padding: 14px 16px;
      border-radius: 16px;
      background: var(--surface);
      border: 2px solid var(--press-color);
      box-shadow: 0 4px 0 0 var(--press-color);
      transition:
        transform var(--press-ms) var(--ease-press),
        box-shadow var(--press-ms) var(--ease-press);
    }
    .pick-row:hover {
      transform: translateY(-4px);
      box-shadow: 0 8px 0 0 var(--press-color);
    }
    .pick-row--away { opacity: 0.55; }
    @media (min-width: 640px) {
      .pick-row { grid-template-columns: 1fr auto auto; }
    }
    .pick-row__name {
      font-family: var(--font-display);
      font-size: var(--text-md);
      font-weight: 500;
      font-style: italic;
      letter-spacing: -0.01em;
    }
    .pick-row__why { color: var(--muted); font-size: var(--text-xs); margin-top: 1px; }
    .pick-row select { padding: 8px 10px; font-size: var(--text-sm); }

    /* Requests waiting on a yes or no. An amber edge, not a red one: this
       needs attention, it is not an error. */
    .card--alert { border-color: var(--line-strong); background: var(--surface-2); }

    .turns {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      padding: 0;
      border-radius: 0;
      background: transparent;
      border: 0;
      color: var(--muted);
      font-size: var(--text-sm);
      font-weight: 500;
    }
    .queue-bar { height: 2px; border-radius: 0; background: var(--surface-3); overflow: hidden; }
    .queue-bar i { display: block; height: 100%; background: var(--amber); }

    /* --- song list -------------------------------------------------- */
    .song-card {
      display: grid;
      gap: 10px;
      padding: 14px 0;
      border-radius: 0;
      background: transparent;
      border: 0;
      border-bottom: 1px solid var(--line);
    }
    .song-card:hover { border-color: var(--line); }
    @media (min-width: 700px) {
      .song-card { grid-template-columns: 1fr auto; align-items: center; }
    }
    .song-card__title { font-weight: 600; font-size: var(--text-md); }
    .song-card--next { background: transparent; border-bottom-color: var(--line-strong); }
    .song-card--played { opacity: 0.5; }
    .song-card--deck { border-bottom: 2px solid var(--amber); opacity: 1; }
    @media (min-width: 700px) {
      .song-card { grid-template-columns: auto 1fr auto; }
      .song-card--plain { grid-template-columns: 1fr auto; }
    }
    .queue-move { display: flex; flex-direction: row; gap: 4px; }
    @media (min-width: 700px) { .queue-move { flex-direction: column; } }
    .queue-move .btn { font-size: var(--text-xs); line-height: 1; }
    .readiness { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 7px; }

    .share { display: grid; gap: 18px; }
    @media (min-width: 620px) { .share { grid-template-columns: auto 1fr; align-items: start; } }
    .share__qr {
      padding: 10px;
      background: #fff;
      border: 1px solid var(--line);
      border-radius: var(--radius);
      line-height: 0;
    }
    .share__qr svg { display: block; }

    /* Printing the settings page gives you a sign-up card for the stage. */
    @media print {
      body { background: #fff; }
      .tabs, .masthead .btn, .btn { display: none !important; }
      .card { border: 0; box-shadow: none; }
      .share__qr { border: 0; }
    }

    .gate { max-width: 420px; margin: 14vh auto 0; }
  </style>
</head>
<body>
  <main class="shell shell--wide" id="app"></main>
  <div id="overlay"></div>
  <script type="module" src="/js/host.js"></script>
</body>
</html>
