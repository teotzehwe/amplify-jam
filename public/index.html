<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#eef1f6">
  <title>Amplify — Jam sign-up</title>
  <link rel="stylesheet" href="/app.css">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'><text y='19' font-size='19'>🎸</text></svg>">
  <style>

    .signup-row {
      display: grid;
      gap: 10px;
      padding: 14px;
      margin-bottom: 8px;
      border-radius: var(--radius);
      background: rgba(255, 255, 255, 0.72);
      border: 1px solid var(--line);
      transition: border-color 0.15s, background 0.15s, box-shadow 0.15s;
    }
    .signup-row:hover { border-color: var(--line-strong); box-shadow: var(--shadow-soft); }
    /* Confirmed = live, not disabled. Teal edge + cool mist fill. */
    .signup-row--in {
      border-color: rgba(15, 118, 110, 0.45);
      background: linear-gradient(180deg, rgba(15, 118, 110, 0.1), rgba(255, 255, 255, 0.85));
      box-shadow: inset 3px 0 0 var(--burnt);
    }
    .signup-row--in .song-row__title { color: var(--ink-burnt); }
    .signup-row select {
      width: auto;
      flex: 1 1 110px;
      min-width: 0;
      padding: 9px 11px;
      font-size: var(--text-sm);
    }
    @media (min-width: 480px) {
      .signup-row { grid-template-columns: 1fr auto; align-items: center; }
    }

    .you-card {
      background: linear-gradient(145deg, rgba(224, 168, 0, 0.12), rgba(255, 255, 255, 0.9) 42%);
      border: 1px solid rgba(224, 168, 0, 0.32);
    }
    .you-card h2 { font-size: var(--text-xl); }
    .you-stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 14px; margin-top: 18px; }
    .you-stat b {
      display: block;
      font-family: var(--font-display);
      font-size: var(--text-2xl);
      font-weight: 700;
      letter-spacing: -0.01em;
      line-height: 1;
    }
    .you-stat span {
      display: block;
      min-height: 2.6em;
      margin-top: 5px;
      color: var(--muted);
      font-size: var(--text-xs);
      text-transform: uppercase;
      letter-spacing: 0.04em;
      line-height: 1.3;
    }

    /* Live call — teal ground, white type (5.47:1). Pure display, no controls. */
    .onstage {
      border: 1px solid var(--burnt);
      background: var(--burnt);
      color: #fff;
      border-radius: var(--radius-lg);
      padding: var(--space-5);
    }
    .onstage .kicker {
      font-family: var(--font-display);
      font-size: var(--text-sm);
      letter-spacing: 0.08em;
      text-transform: uppercase;
      font-weight: 600;
    }
    .onstage .what { font-family: var(--font-display); font-size: var(--text-2xl); font-weight: 700; margin-top: 4px; letter-spacing: -0.01em; }
    .onstage p { color: #fff; } to { transform: scale(1); opacity: 1; } }

    details.card > summary {
      list-style: none;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 10px;
      font-weight: 600;
    }
    details.card > summary::-webkit-details-marker { display: none; }
    details.card > summary::after { content: "▾"; margin-left: auto; color: var(--faint); transition: transform 0.2s; }
    details.card[open] > summary::after { transform: rotate(180deg); }
    details.card > summary + * { margin-top: 16px; }

    .step-num {
      display: inline-grid;
      place-items: center;
      width: 24px; height: 24px;
      border-radius: 50%;
      background: var(--amber);
      color: var(--ink);
      font-size: var(--text-xs);
      font-weight: 700;
      flex: none;
    }
  </style>
</head>
<body>
  <main class="shell" id="app"></main>
  <script type="module" src="/js/player.js"></script>
</body>
</html>
