<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#F4F0E8">
  <title>Amplify — Jam sign-up</title>
  <link rel="icon" type="image/png" sizes="64x64" href="/brand/favicon.png">
  <link rel="apple-touch-icon" href="/brand/mark-a-sm.png">
  <link rel="stylesheet" href="/app.css">
  <style>
    .signup-row {
      display: grid;
      gap: 10px;
      padding: 12px 0;
      border-bottom: 1px solid var(--line);
    }
    .signup-row:last-child { border-bottom: 0; }
    .signup-row--in .song-row__title { font-weight: 700; }
    .signup-row select {
      width: auto;
      flex: 1 1 110px;
      min-width: 0;
      padding: 8px 10px;
      font-size: var(--text-sm);
    }
    @media (min-width: 480px) {
      .signup-row { grid-template-columns: 1fr auto; align-items: center; }
    }

    .meta-line { margin: 10px 0 4px; }

    .onstage {
      border: 1px solid var(--amber);
      background: var(--amber);
      color: var(--cream);
      border-radius: var(--radius-lg);
      padding: var(--space-5);
    }
    .onstage .kicker {
      font-size: var(--text-xs);
      font-weight: 600;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: rgba(247, 242, 232, 0.72);
    }
    .onstage .what {
      font-size: clamp(1.35rem, 4vw, 1.75rem);
      font-weight: 500;
      letter-spacing: -0.02em;
      margin-top: 8px;
      color: var(--cream);
    }
    .onstage p { color: rgba(247, 242, 232, 0.82); }

    details.folio > summary {
      list-style: none;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 10px;
      font-weight: 700;
    }
    details.folio > summary::-webkit-details-marker { display: none; }
    details.folio > summary::after { content: "▾"; margin-left: auto; color: var(--faint); }
    details.folio[open] > summary::after { transform: rotate(180deg); }
    details.folio > summary + * { margin-top: 16px; }

    /* step wizard retired */
    .step-num-retired {
      color: var(--faint);
      font-size: var(--text-sm);
      font-weight: 600;
      font-variant-numeric: tabular-nums;
      min-width: 1.2em;
    }
  </style>
</head>
<body>
  <main class="shell" id="app"></main>
  <script type="module" src="/js/player.js"></script>
</body>
</html>
