<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f7f2e8">
  <title>Amplify — Jam sign-up</title>
  <link rel="stylesheet" href="/app.css">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' fill='%23465016'/><path d='M8 20v-4m4 8v-12m4 16V6m4 14v-8m4 6v-2' stroke='%23f7f2e8' stroke-width='2.5' stroke-linecap='round' fill='none'/></svg>">
  <style>
    .signup-row {
      display: grid;
      gap: 10px;
      padding: 12px 0;
      border-bottom: 1px solid var(--line);
    }
    .signup-row:last-child { border-bottom: 0; }
    .signup-row--in .song-row__title { font-weight: 700; }
    .signup-row select {
      width: auto;
      flex: 1 1 110px;
      min-width: 0;
      padding: 8px 10px;
      font-size: var(--text-sm);
    }
    @media (min-width: 480px) {
      .signup-row { grid-template-columns: 1fr auto; align-items: center; }
    }

    .you-card { background: transparent; }
    .you-card h2 { font-size: var(--text-lg); font-weight: 500; letter-spacing: -0.015em; }
    .you-stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; margin-top: 16px; }
    .you-stat b {
      display: block;
      font-size: var(--text-xl);
      font-weight: 500;
      letter-spacing: -0.02em;
      line-height: 1;
      color: var(--ink-amber);
    }
    .you-stat span {
      display: block;
      margin-top: 4px;
      color: var(--muted);
      font-size: var(--text-sm);
      line-height: 1.3;
    }

    .onstage {
      border: 1px solid var(--amber);
      background: var(--amber);
      color: var(--cream);
      border-radius: var(--radius-lg);
      padding: var(--space-5);
    }
    .onstage .kicker {
      font-size: var(--text-xs);
      font-weight: 600;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: rgba(247, 242, 232, 0.72);
    }
    .onstage .what {
      font-size: clamp(1.35rem, 4vw, 1.75rem);
      font-weight: 500;
      letter-spacing: -0.02em;
      margin-top: 8px;
      color: var(--cream);
    }
    .onstage p { color: rgba(247, 242, 232, 0.82); }

    details.card > summary {
      list-style: none;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 10px;
      font-weight: 500;
    }
    details.card > summary::-webkit-details-marker { display: none; }
    details.card > summary::after { content: "▾"; margin-left: auto; color: var(--faint); }
    details.card[open] > summary::after { transform: rotate(180deg); }
    details.card > summary + * { margin-top: 16px; }

    .step-num {
      color: var(--faint);
      font-size: var(--text-sm);
      font-weight: 600;
      font-variant-numeric: tabular-nums;
      min-width: 1.2em;
    }
  </style>
</head>
<body>
  <main class="shell" id="app"></main>
  <script type="module" src="/js/player.js"></script>
</body>
</html>
